<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestion Produits - NUMA Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --black: #0a0a0a; --gray: #f1f1f1; --line: #e5e5e5; --red: #e11d48; --green: #16a34a; --blue: #2563eb; --gold: #d97706; --max: 1280px; }
    body { font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif; color: var(--black); background: #f9fafb; -webkit-font-smoothing: antialiased; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    img { display: block; max-width: 100%; }
    svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* ÉCRANS */
    .screen { display: none; }
    .screen.active { display: block; }

    /* LOGIN */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .login-card { width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 36px 32px; box-shadow: 0 20px 50px rgba(0,0,0,.06); }
    .login-card h1 { font-size: 24px; font-weight: 800; margin-bottom: 6px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; }
    .field input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 8px; font: inherit; font-size: 14px; outline: none; }
    .btn-primary { width: 100%; padding: 14px; background: var(--black); color: #fff; border-radius: 8px; font-size: 14px; font-weight: 700; text-transform: uppercase; margin-top: 8px; }
    .btn-primary:hover { background: var(--red); }
    .login-error { background: rgba(225,29,72,.08); color: var(--red); padding: 10px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 16px; display: none; }
    .login-error.show { display: block; }

    /* LAYOUT ADMIN */
    .admin-layout { display: flex; min-height: 100vh; }
    .sidebar { width: 260px; background: var(--black); color: #fff; position: fixed; height: 100vh; z-index: 100; transition: transform .3s; }
    .sidebar-header { padding: 24px; border-bottom: 1px solid rgba(255,255,255,.1); display: flex; align-items: center; gap: 12px; }
    .sidebar-header img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
    .sidebar-header span { font-weight: 800; font-size: 20px; }
    .sidebar-nav { padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; color: #a3a3a3; }
    .nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
    .nav-item.active { background: var(--red); color: #fff; }
    .nav-item svg { width: 20px; height: 20px; }
    .sidebar-footer { position: absolute; bottom: 0; width: 100%; padding: 20px 24px; border-top: 1px solid rgba(255,255,255,.1); font-size: 12px; }
    .sidebar-footer .email { color: #a3a3a3; display: block; margin-bottom: 12px; }
    .btn-logout { width: 100%; padding: 10px; background: rgba(255,255,255,.1); color: #fff; border-radius: 6px; font-weight: 700; }

    /* MAIN CONTENT */
    .main-content { flex: 1; margin-left: 260px; padding: 32px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .top-bar h1 { font-size: 26px; font-weight: 800; }
    
    /* LISTE DES PRODUITS */
    .table-wrap { background: #fff; border-radius: 12px; border: 1px solid var(--line); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 16px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
    th { background: #fafafa; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #888; }
    .prod-img { width: 48px; height: 64px; border-radius: 6px; object-fit: cover; background: var(--gray); }
    .btn-edit { background: var(--black); color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 700; }
    .btn-edit:hover { background: var(--red); }

    /* FORMULAIRE */
    .form-card { background: #fff; border-radius: 12px; border: 1px solid var(--line); padding: 32px; max-width: 900px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; }
    .form-group input[type="text"], .form-group input[type="number"], .form-group textarea, .form-group select {
      width: 100%; padding: 12px; border: 1.5px solid var(--line); border-radius: 8px; font: inherit; font-size: 14px;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--black); outline: none; }
    .form-group textarea { resize: vertical; min-height: 100px; }
    
    .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 14px; font-weight: 600; }
    
    .stock-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .stock-item label { display: block; font-size: 11px; font-weight: 700; color: #666; margin-bottom: 4px; }
    .stock-item input { width: 100%; padding: 8px; border: 1.5px solid var(--line); border-radius: 6px; font: inherit; text-align: center; }

    /* IMAGES */
    .image-upload-box { border: 2px dashed var(--line); border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; transition: .2s; }
    .image-upload-box:hover { border-color: var(--black); background: #fafafa; }
    .image-upload-box input[type="file"] { display: none; }
    .image-preview-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
    .img-preview-item { position: relative; aspect-ratio: 3/4; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
    .img-preview-item img { width: 100%; height: 100%; object-fit: cover; }
    .btn-remove-img { position: absolute; top: 4px; right: 4px; background: var(--red); color: #fff; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-weight: bold; cursor: pointer; }

    .form-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line); }
    .btn-cancel { padding: 12px 24px; border-radius: 8px; border: 1.5px solid var(--line); font-weight: 700; background: #fff; }
    .btn-save { padding: 12px 24px; border-radius: 8px; background: var(--black); color: #fff; font-weight: 700; }
    .btn-save:hover { background: var(--red); }

    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--black); color: #fff; padding: 14px 24px; border-radius: 99px; font-weight: 600; opacity: 0; transition: .3s; z-index: 1000; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .main-content { margin-left: 0; padding: 16px; }
      .form-grid { grid-template-columns: 1fr; }
      .stock-grid { grid-template-columns: repeat(2, 1fr); }
      .image-preview-grid { grid-template-columns: repeat(2, 1fr); }
      .top-bar { flex-direction: column; align-items: flex-start; gap: 12px; }
    }
  </style>
</head>
<body>

  <!-- ÉCRAN : LOGIN -->
  <section class="screen" id="screenLogin">
    <div class="login-wrap">
      <div class="login-card">
        <h1>Espace administrateur</h1>
        <div class="login-error" id="loginError"></div>
        <form id="loginForm">
          <div class="field">
            <label>E-mail</label>
            <input type="email" id="loginEmail" required>
          </div>
          <div class="field">
            <label>Mot de passe</label>
            <input type="password" id="loginPassword" required>
          </div>
          <button type="submit" class="btn-primary">Se connecter</button>
        </form>
      </div>
    </div>
  </section>

  <!-- ÉCRAN : ADMIN -->
  <section class="screen" id="screenAdmin">
    <div class="admin-layout">
      
      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <img src="../image/logo.jpeg" alt="NUMA">
          <span>NUMA Admin</span>
        </div>
        <nav class="sidebar-nav">
          <a href="admin-dashboard.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Tableau de bord
          </a>
          <a href="../commandes.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            Commandes
          </a>
          <a href="admin-produits.html" class="nav-item active">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
            Produits
          </a>
        </nav>
        <div class="sidebar-footer">
          <span class="email" id="userEmail"></span>
          <button class="btn-logout" id="logoutBtn">Déconnexion</button>
        </div>
      </aside>

      <!-- MAIN CONTENT -->
      <main class="main-content">
        
        <!-- VUE 1 : LISTE DES PRODUITS -->
        <div id="viewList">
          <div class="top-bar">
            <h1>Mes Produits</h1>
            <button class="btn-primary" style="width:auto; padding: 10px 20px;" onclick="showForm()">+ Ajouter un produit</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Produit</th>
                  <th>Prix</th>
                  <th>Stock total</th>
                  <th>Statut</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="productsTableBody">
                <tr><td colspan="5" style="text-align:center;">Chargement...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- VUE 2 : FORMULAIRE AJOUT / MODIFICATION -->
        <div id="viewForm" style="display: none;">
          <div class="top-bar">
            <h1 id="formTitle">Ajouter un produit</h1>
          </div>
          
          <div class="form-card">
            <form id="productForm">
              <div class="form-grid">
                
                <!-- COLONNE GAUCHE -->
                <div>
                  <div class="form-group">
                    <label>Titre du produit *</label>
                    <input type="text" id="pTitle" required>
                  </div>
                  <div class="form-group">
                    <label>Description</label>
                    <textarea id="pDesc"></textarea>
                  </div>
                  <div class="form-group">
                    <label>Catégorie</label>
                    <input type="text" id="pCategory" placeholder="Ex: T-shirts, Robes...">
                  </div>
                  <div class="form-group">
                    <label>Sexe</label>
                    <select id="pSex">
                      <option value="unisexe">Unisexe</option>
                      <option value="homme">Homme</option>
                      <option value="femme">Femme</option>
                    </select>
                  </div>
                  
                  <div class="form-group">
                    <label>Prix (CFA) *</label>
                    <input type="number" id="pPrice" min="0" required>
                  </div>
                  <div class="form-group">
                    <label>Ancien Prix (CFA) - Optionnel</label>
                    <input type="number" id="pOldPrice" min="0">
                  </div>

                  <div class="form-group">
                    <label>Options</label>
                    <div class="checkbox-group">
                      <input type="checkbox" id="pPromo"> <label for="pPromo" style="margin:0;">En promotion</label>
                    </div>
                    <div class="checkbox-group">
                      <input type="checkbox" id="pExclusive"> <label for="pExclusive" style="margin:0;">Produit exclusif</label>
                    </div>
                  </div>

                  <div class="form-group">
                    <label>Statut</label>
                    <div class="checkbox-group">
                      <input type="radio" name="pStatus" value="visible" id="statusVisible" checked> <label for="statusVisible" style="margin:0;">Visible</label>
                    </div>
                    <div class="checkbox-group">
                      <input type="radio" name="pStatus" value="masque" id="statusMasque"> <label for="statusMasque" style="margin:0;">Masqué</label>
                    </div>
                  </div>
                </div>

                <!-- COLONNE DROITE -->
                <div>
                  <div class="form-group">
                    <label>Stock par taille</label>
                    <div class="stock-grid">
                      <div class="stock-item"><label>XS</label><input type="number" id="sXS" min="0" value="0"></div>
                      <div class="stock-item"><label>S</label><input type="number" id="sS" min="0" value="0"></div>
                      <div class="stock-item"><label>M</label><input type="number" id="sM" min="0" value="0"></div>
                      <div class="stock-item"><label>L</label><input type="number" id="sL" min="0" value="0"></div>
                      <div class="stock-item"><label>XL</label><input type="number" id="sXL" min="0" value="0"></div>
                      <div class="stock-item"><label>XXL</label><input type="number" id="sXXL" min="0" value="0"></div>
                      <div class="stock-item"><label>3XL</label><input type="number" id="s3XL" min="0" value="0"></div>
                    </div>
                  </div>

                  <div class="form-group">
                    <label>Images (Cloudinary)</label>
                    <div class="image-upload-box" onclick="document.getElementById('pImagesInput').click()">
                      <p style="font-weight:600; font-size:14px;">📸 Cliquez pour ajouter des images</p>
                      <p style="font-size:12px; color:#888;">JPG, PNG, WEBP (Max 5Mo)</p>
                      <input type="file" id="pImagesInput" multiple accept="image/*">
                    </div>
                    <div class="image-preview-grid" id="imagesPreviewContainer">
                      <!-- Les images s'affichent ici -->
                    </div>
                  </div>
                </div>

              </div>

              <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="showList()">Annuler</button>
                <button type="submit" class="btn-save" id="btnSave">Enregistrer le produit</button>
              </div>
            </form>
          </div>
        </div>

      </main>
    </div>
  </section>

  <div class="toast" id="toast">Message</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, getDoc, addDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ CONFIGURATION FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyDwANGMWqawTG1XBz-49mFgoUYVJNxh2kI",
      authDomain: "numa-com.firebaseapp.com",
      projectId: "numa-com",
      storageBucket: "numa-com.firebasestorage.app",
      messagingSenderId: "953579157946",
      appId: "1:953579157946:web:4fff5a890cf82f1ccec583"
    };

    // ⚠️ CONFIGURATION CLOUDINARY (À REMPLACER PAR TES INFOS)
    const CLOUDINARY_CLOUD_NAME = "TON_CLOUD_NAME"; // Ex: "dxxxxxx"
    const CLOUDINARY_UPLOAD_PRESET = "numa_unsigned"; // Le preset Unsigned que tu as créé

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ADMIN_EMAILS = ["offxbuba@gmail.com"];
    const $ = id => document.getElementById(id);
    
    let currentProducts = [];
    let currentEditId = null; // null = ajout, sinon = ID du produit à modifier
    let currentImages = [];   // Tableau des URLs d'images

    /* ==========================================================
       TOAST
       ========================================================== */
    let toastTimer;
    function showToast(msg, isError = false) {
      const t = $("toast");
      t.textContent = msg;
      t.style.background = isError ? "var(--red)" : "var(--black)";
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
    }

    /* ==========================================================
       AUTH
       ========================================================== */
    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = $("loginEmail").value.trim();
      const password = $("loginPassword").value;
      
      $("loginError").classList.remove("show");
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        $("loginError").textContent = "E-mail ou mot de passe incorrect.";
        $("loginError").classList.add("show");
      }
    });

    $("logoutBtn").addEventListener("click", async () => {
      await signOut(auth);
      location.reload();
    });

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        showScreen("Login");
        return;
      }
      $("userEmail").textContent = user.email;
      
      if (!ADMIN_EMAILS.includes(user.email.toLowerCase())) {
        $("loginError").textContent = `Le compte ${user.email} n'est pas autorisé.`;
        $("loginError").classList.add("show");
        signOut(auth);
        showScreen("Login");
        return;
      }

      showScreen("Admin");
      loadProducts();
    });

    function showScreen(name) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      $("screen" + name).classList.add("active");
    }

    /* ==========================================================
       NAVIGATION LISTE <-> FORMULAIRE
       ========================================================== */
    window.showList = () => {
      $("viewList").style.display = "block";
      $("viewForm").style.display = "none";
      currentEditId = null;
      loadProducts(); // Rafraîchir la liste
    };

    window.showForm = async (productId = null) => {
      $("viewList").style.display = "none";
      $("viewForm").style.display = "block";
      
      currentEditId = productId;
      currentImages = [];

      if (productId) {
        // MODE MODIFICATION
        $("formTitle").textContent = "Modifier le produit";
        const p = currentProducts.find(x => x.id === productId);
        if (!p) return showToast("Produit introuvable", true);

        // Remplir les champs texte
        $("pTitle").value = p.titre || "";
        $("pDesc").value = p.description || "";
        $("pCategory").value = p.categorie || "";
        $("pSex").value = p.sexe || "unisexe";
        $("pPrice").value = p.prix || 0;
        $("pOldPrice").value = p.ancienPrix || "";
        $("pPromo").checked = p.promo === true;
        $("pExclusive").checked = p.exclusif === true;
        
        // Statut
        if (p.statut === "masque" || p.actif === false) $("statusMasque").checked = true;
        else $("statusVisible").checked = true;

        // Stock
        const stock = p.stock || {};
        $("sXS").value = stock.XS || 0;
        $("sS").value = stock.S || 0;
        $("sM").value = stock.M || 0;
        $("sL").value = stock.L || 0;
        $("sXL").value = stock.XL || 0;
        $("sXXL").value = stock.XXL || 0;
        $("s3XL").value = stock["3XL"] || 0;

        // Images
        currentImages = p.images || (p.imageUrl ? [p.imageUrl] : []);

      } else {
        // MODE AJOUT
        $("formTitle").textContent = "Ajouter un produit";
        $("productForm").reset();
        currentImages = [];
      }
      
      renderImagesPreview();
    };

    /* ==========================================================
       CHARGER LA LISTE DES PRODUITS
       ========================================================== */
    async function loadProducts() {
      try {
        $("productsTableBody").innerHTML = `<tr><td colspan="5" style="text-align:center;">Chargement...</td></tr>`;
        const snap = await getDocs(collection(db, "produits"));
        currentProducts = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }))
                                   .sort((a, b) => (a.titre || "").localeCompare(b.titre || ""));

        if (currentProducts.length === 0) {
          $("productsTableBody").innerHTML = `<tr><td colspan="5" style="text-align:center;">Aucun produit.</td></tr>`;
          return;
        }

        $("productsTableBody").innerHTML = currentProducts.map(p => {
          let totalStock = 0;
          if (p.stock) Object.values(p.stock).forEach(v => totalStock += Number(v) || 0);
          
          const isVisible = p.statut !== "masque" && p.actif !== false;
          const img = (p.images && p.images[0]) || p.imageUrl || "https://via.placeholder.com/48x64";

          return `
            <tr>
              <td>
                <div style="display:flex; align-items:center; gap:12px;">
                  <img src="${img}" class="prod-img">
                  <span style="font-weight:700;">${p.titre || "Sans titre"}</span>
                </div>
              </td>
              <td style="font-weight:700; color:var(--red);">${(p.prix || 0).toLocaleString('fr-FR')} CFA</td>
              <td>${totalStock}</td>
              <td><span class="badge ${isVisible ? 'paye' : 'annule'}" style="padding:4px 8px; border-radius:4px; font-size:11px;">${isVisible ? 'Visible' : 'Masqué'}</span></td>
              <td>
                <button class="btn-edit" onclick="showForm('${p.id}')">Modifier</button>
              </td>
            </tr>
          `;
        }).join("");

      } catch (err) {
        console.error(err);
        showToast("Erreur de chargement", true);
      }
    }

    /* ==========================================================
       GESTION DES IMAGES (CLOUDINARY)
       ========================================================== */
    function renderImagesPreview() {
      const container = $("imagesPreviewContainer");
      if (currentImages.length === 0) {
        container.innerHTML = `<p style="font-size:12px; color:#888; grid-column:1/-1;">Aucune image sélectionnée.</p>`;
        return;
      }

      container.innerHTML = currentImages.map((url, index) => `
        <div class="img-preview-item">
          <img src="${url}">
          <button type="button" class="btn-remove-img" onclick="removeImage(${index})">×</button>
        </div>
      `).join("");
    }

    window.removeImage = (index) => {
      currentImages.splice(index, 1);
      renderImagesPreview();
    };

    $("pImagesInput").addEventListener("change", async (e) => {
      const files = Array.from(e.target.files);
      if (files.length === 0) return;

      // Vérification config
      if (CLOUDINARY_CLOUD_NAME === "TON_CLOUD_NAME") {
        showToast("Configure ton Cloud Name dans le code !", true);
        return;
      }

      $("btnSave").disabled = true;
      $("btnSave").textContent = "Upload en cours...";

      for (const file of files) {
        try {
          const formData = new FormData();
          formData.append("file", file);
          formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
          formData.append("folder", "produits");

          const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
            method: "POST",
            body: formData
          });
          const data = await res.json();
          
          if (data.secure_url) {
            currentImages.push(data.secure_url);
          } else {
            console.error(data);
            showToast("Erreur Cloudinary", true);
          }
        } catch (err) {
          console.error(err);
          showToast("Erreur réseau Cloudinary", true);
        }
      }

      renderImagesPreview();
      $("btnSave").disabled = false;
      $("btnSave").textContent = "Enregistrer le produit";
      e.target.value = ""; // Reset input
    });

    /* ==========================================================
       SOUMISSION DU FORMULAIRE
       ========================================================== */
    $("productForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const stock = {
        XS: Number($("sXS").value) || 0,
        S: Number($("sS").value) || 0,
        M: Number($("sM").value) || 0,
        L: Number($("sL").value) || 0,
        XL: Number($("sXL").value) || 0,
        XXL: Number($("sXXL").value) || 0,
        "3XL": Number($("s3XL").value) || 0
      };

      const productData = {
        titre: $("pTitle").value.trim(),
        description: $("pDesc").value.trim(),
        categorie: $("pCategory").value.trim(),
        sexe: $("pSex").value,
        prix: Number($("pPrice").value),
        ancienPrix: $("pOldPrice").value ? Number($("pOldPrice").value) : null,
        promo: $("pPromo").checked,
        exclusif: $("pExclusive").checked,
        statut: document.querySelector('input[name="pStatus"]:checked').value,
        actif: document.querySelector('input[name="pStatus"]:checked').value === "visible",
        stock: stock,
        images: currentImages,
        imageUrl: currentImages[0] || "", // Pour compatibilité avec les anciennes pages
        updatedAt: serverTimestamp()
      };

      $("btnSave").disabled = true;
      $("btnSave").textContent = "Enregistrement...";

      try {
        if (currentEditId) {
          // MISE À JOUR
          await updateDoc(doc(db, "produits", currentEditId), productData);
          showToast("Produit mis à jour ✓");
        } else {
          // AJOUT
          productData.createdAt = serverTimestamp();
          await addDoc(collection(db, "produits"), productData);
          showToast("Produit ajouté ✓");
        }
        
        // Retour à la liste après 1s
        setTimeout(() => { showList(); }, 1000);

      } catch (err) {
        console.error(err);
        showToast("Erreur lors de l'enregistrement", true);
        $("btnSave").disabled = false;
        $("btnSave").textContent = "Enregistrer le produit";
      }
    });

  </script>
</body>
</html>
