<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Commandes – NUMA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --black: #0a0a0a; --gray: #f9f9f9; --line: #e5e5e5; --red: #e11d48; --green: #16a34a; --orange: #f59e0b; --blue: #2563eb; --max: 1100px; }
    body { font-family: "Montserrat", sans-serif; background: #f5f5f5; color: var(--black); padding-bottom: 40px; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    img { display: block; max-width: 100%; }
    svg { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .header { position: sticky; top: 0; z-index: 50; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,.06); }
    .header-inner { max-width: var(--max); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; }
    .brand-icon { width: 48px; height: 48px; border-radius: 12px; }
    .admin-badge { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--red); padding: 6px 12px; border: 1.5px solid var(--red); border-radius: 99px; }

    .page { max-width: var(--max); margin: 0 auto; padding: 20px 16px; }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .title-count { background: var(--red); color: #fff; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 99px; }

    .access-denied { max-width: 500px; margin: 60px auto; text-align: center; background: #fff; padding: 40px 24px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
    .access-denied .icon { width: 70px; height: 70px; background: #fde8ed; color: var(--red); border-radius: 50%; display: grid; place-items: center; margin: 0 auto 20px; }
    .access-denied h2 { font-size: 22px; font-weight: 800; margin-bottom: 10px; }
    .access-denied p { font-size: 14px; color: #666; margin-bottom: 24px; line-height: 1.5; }
    .access-denied a { display: inline-block; background: var(--black); color: #fff; padding: 14px 24px; border-radius: 8px; font-weight: 700; font-size: 14px; }

    /* STATS : auto-fit pour accueillir 5 cartes proprement */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 18px; }
    .stat-card { background: #fff; border-radius: 12px; padding: 14px; border: 1px solid var(--line); }
    .stat-card .label { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
    .stat-card .val { font-size: 22px; font-weight: 800; }
    .stat-card.pending .val { color: var(--orange); }
    .stat-card.unpaid .val { color: var(--red); }
    .stat-card.paid .val { color: var(--green); }
    .stat-card.suspicious { border-color: var(--red); background: #fef2f2; }
    .stat-card.suspicious .label, .stat-card.suspicious .val { color: var(--red); }

    .search-wrap { position: relative; margin-bottom: 14px; }
    .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: #999; }
    .search-wrap input { width: 100%; padding: 13px 14px 13px 40px; border: 1.5px solid var(--line); border-radius: 10px; font: inherit; font-size: 14px; background: #fff; }
    .search-wrap input:focus { outline: none; border-color: var(--black); }

    .filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter-btn { flex-shrink: 0; padding: 8px 16px; border-radius: 99px; border: 1.5px solid var(--line); background: #fff; font-weight: 600; font-size: 13px; white-space: nowrap; transition: .2s; }
    .filter-btn:hover { border-color: var(--black); }
    .filter-btn.active { background: var(--black); color: #fff; border-color: var(--black); }
    .filter-btn.paid.active { background: var(--green); border-color: var(--green); }
    .filter-btn.unpaid.active { background: var(--red); border-color: var(--red); }
    .filter-btn.suspicious { border-color: var(--red); color: var(--red); }
    .filter-btn.suspicious.active { background: var(--red); color: #fff; }

    .order-card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; border: 1px solid var(--line); }
    .order-card.suspicious-card { border: 2px solid var(--red); box-shadow: 0 4px 14px rgba(225,29,72,0.12); }

    .suspicious-banner { background: #fef2f2; border: 1px solid var(--red); color: #991b1b; padding: 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; line-height: 1.5; }
    .suspicious-banner strong { color: var(--red); display: block; margin-bottom: 4px; }
    .suspicious-banner .anomaly-line { font-size: 12px; padding: 3px 0; border-top: 1px dashed rgba(225,29,72,0.3); }
    .suspicious-banner .anomaly-line:first-of-type { border-top: 0; }
    .suspicious-banner .anomaly-line b { color: var(--red); }

    .order-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .order-id { font-weight: 800; font-size: 15px; }
    .order-date { font-size: 12px; color: #777; margin-top: 2px; }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

    .status { padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; text-transform: uppercase; display: inline-block; white-space: nowrap; }
    .status.en_attente { background: #fef3c7; color: #b45309; }
    .status.confirmee { background: #e0f2fe; color: #0369a1; }
    .status.en_preparation { background: #f3e8ff; color: #6b21a8; }
    .status.expediee { background: #e0e7ff; color: #4338ca; }
    .status.livree { background: #dcfce7; color: #15803d; }
    .status.annulee { background: #fee2e2; color: #b91c1c; }

    .pay-badge { padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 700; display: inline-block; white-space: nowrap; }
    .pay-badge.paye { background: #dcfce7; color: #15803d; }
    .pay-badge.non_paye { background: #fee2e2; color: #b91c1c; }
    .pay-badge.livraison { background: #e0f2fe; color: #0369a1; }

    .client-block { background: var(--gray); border-radius: 10px; padding: 12px; margin-bottom: 12px; }
    .client-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
    .client-info { font-size: 13px; color: #555; margin-bottom: 10px; }
    .client-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .action-btn { padding: 9px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; transition: .15s; border: 1.5px solid var(--line); background: #fff; }
    .action-btn:hover { border-color: var(--black); }
    .action-btn.call { border-color: var(--black); }
    .action-btn.wa { background: #25d366; color: #fff; border-color: #25d366; }
    .action-btn.maps { border-color: var(--blue); color: var(--blue); }
    .action-btn.maps:hover { background: var(--blue); color: #fff; }
    .action-btn svg { width: 16px; height: 16px; }

    .items { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
    .item { display: flex; gap: 10px; align-items: center; }
    .item img { width: 44px; height: 54px; object-fit: cover; border-radius: 6px; background: var(--gray); }
    .item-info { flex: 1; font-size: 13px; min-width: 0; }
    .item-title { font-weight: 600; }
    .item-meta { font-size: 11px; color: #777; }
    .item-price { font-weight: 700; font-size: 13px; white-space: nowrap; }
    .item-price.suspect { color: var(--red); text-decoration: line-through; }

    .card-footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-top: 12px; border-top: 1px dashed var(--line); flex-wrap: wrap; }
    .total-box { font-weight: 800; font-size: 17px; }
    .total-box span { font-size: 11px; color: #888; font-weight: 600; display: block; }
    .order-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .select-status { padding: 9px 10px; border-radius: 8px; border: 1.5px solid var(--line); font-family: inherit; font-size: 13px; font-weight: 600; background: #fff; cursor: pointer; }
    .select-status:focus { outline: none; border-color: var(--black); }
    .btn-paid { padding: 9px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 700; background: var(--green); color: #fff; }
    .btn-unpaid { padding: 9px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 700; background: var(--red); color: #fff; }
    .btn-paid:disabled, .btn-unpaid:disabled, .select-status:disabled { opacity: .5; cursor: not-allowed; }

    .state { text-align: center; padding: 60px 20px; color: #777; font-weight: 600; }

    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 100; transform: translate(-50%, 20px); background: var(--black); color: #fff; padding: 14px 22px; border-radius: 99px; font-size: 13px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: .3s; white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.ok { background: var(--green); }
    .toast.bad { background: var(--red); }

    .new-order-banner { position: fixed; top: 80px; left: 50%; transform: translate(-50%, -20px); background: var(--green); color: #fff; padding: 14px 22px; border-radius: 12px; font-weight: 700; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.2); z-index: 99; opacity: 0; pointer-events: none; transition: .3s; text-align: center; }
    .new-order-banner.show { opacity: 1; transform: translate(-50%, 0); }

    @media (min-width: 1024px) {
      .page { padding: 30px 40px; }
      .header-inner { padding: 18px 40px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a href="index.html"><img src="image/logo.jpeg" alt="NUMA" class="brand-icon"></a>
      <span class="admin-badge">Admin — Commandes</span>
    </div>
  </header>

  <main class="page">
    <div id="mainContent" style="display:none;">
      <h1>
        COMMANDES
        <span class="title-count" id="totalCount">0</span>
      </h1>

      <div class="stats">
        <div class="stat-card pending">
          <div class="label">En attente</div>
          <div class="val" id="countPending">0</div>
        </div>
        <div class="stat-card">
          <div class="label">À confirmer</div>
          <div class="val" id="countToConfirm">0</div>
        </div>
        <div class="stat-card unpaid">
          <div class="label">Paiement non reçu</div>
          <div class="val" id="countUnpaid">0</div>
        </div>
        <div class="stat-card paid">
          <div class="label">Total payé</div>
          <div class="val" id="countPaid">0</div>
        </div>
        <div class="stat-card suspicious">
          <div class="label">⚠ Suspectes</div>
          <div class="val" id="countSuspicious">0</div>
        </div>
      </div>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="Rechercher par numéro, nom ou téléphone...">
      </div>

      <div class="filters" id="statusFilters">
        <button class="filter-btn active" data-status="all">Toutes</button>
        <button class="filter-btn" data-status="en_attente">En attente</button>
        <button class="filter-btn" data-status="confirmee">Confirmées</button>
        <button class="filter-btn" data-status="en_preparation">En préparation</button>
        <button class="filter-btn" data-status="expediee">Expédiées</button>
        <button class="filter-btn" data-status="livree">Livrées</button>
        <button class="filter-btn" data-status="annulee">Annulées</button>
        <button class="filter-btn suspicious" data-status="suspicious">⚠ Suspectes</button>
      </div>

      <div class="filters" id="payFilters">
        <button class="filter-btn active" data-pay="all">Tous paiements</button>
        <button class="filter-btn paid" data-pay="paye">Payé</button>
        <button class="filter-btn unpaid" data-pay="non_paye">Non payé</button>
      </div>

      <div id="ordersList"></div>
    </div>

    <div class="access-denied" id="accessDenied" style="display:none;">
      <div class="icon">
        <svg viewBox="0 0 24 24" style="width:32px;height:32px;"><path d="M12 2L4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6l-8-4z"/><path d="M12 8v5M12 16v.01"/></svg>
      </div>
      <h2>Accès refusé</h2>
      <p>Vous n'avez pas les droits nécessaires pour accéder à cette page.</p>
      <a href="index.html">Retour à l'accueil</a>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <div class="new-order-banner" id="newOrderBanner">🔔 Nouvelle commande !</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    // IMPORTANT : on ajoute getDocs pour charger le catalogue produits
    import { getFirestore, collection, onSnapshot, doc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⚠️ REMPLACE PAR TON UID ADMIN
    const ADMIN_UIDS = ["TON_UID_ICI"];

    const firebaseConfig = { apiKey: "AIzaSyDwANGMWqawTG1XBz-49mFgoUYVJNxh2kI", authDomain: "numa-com.firebaseapp.com", projectId: "numa-com", storageBucket: "numa-com.firebasestorage.app", messagingSenderId: "953579157946", appId: "1:953579157946:web:4fff5a890cf82f1ccec583" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = id => document.getElementById(id);
    const fmt = n => Number(n || 0).toLocaleString("fr-FR").replace(/\u202f|\u00a0/g, ".") + " CFA";
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    const STATUS_LABELS = {
      en_attente: "En attente",
      confirmee: "Confirmée",
      en_preparation: "En préparation",
      expediee: "Expédiée",
      livree: "Livrée",
      annulee: "Annulée"
    };

    let allOrders = [];
    let productCatalog = {};   // id → { prix, titre, imageUrl, ... }
    let currentStatus = "all";
    let currentPay = "all";
    let searchQuery = "";
    let isFirstLoad = true;

    let toastTimer;
    function toast(text, kind = "") {
      const t = $("toast");
      t.textContent = text;
      t.className = "toast show " + kind;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
    }

    function cleanPhone(phone) {
      let p = String(phone || "").replace(/\D/g, "");
      if (p.length === 9) p = "221" + p;
      return p;
    }

    // ============================================================
    // ANALYSE D'UNE COMMANDE : détecte les anomalies de prix
    // ============================================================
    function analyzeOrder(o) {
      const anomalies = [];
      let catalogTotal = 0;   // Total théorique basé sur les prix catalogue actuels
      let articleTotal = 0;   // Total selon les prix stockés dans la commande

      for (const art of (o.articles || [])) {
        const artPrix = Number(art.prix) || 0;
        const artQte = Math.max(0, Number(art.quantite) || 0);
        articleTotal += artPrix * artQte;

        if (!art.produitId) {
          anomalies.push({
            type: "missing_id",
            titre: art.titre || "Article",
            cmdPrix: artPrix,
            catPrix: null,
            message: "Aucun identifiant produit (impossible de vérifier le prix)"
          });
          catalogTotal += artPrix * artQte;
        } else {
          const catalog = productCatalog[art.produitId];
          if (!catalog) {
            anomalies.push({
              type: "not_in_catalog",
              titre: art.titre || "Article",
              cmdPrix: artPrix,
              catPrix: null,
              message: "Produit introuvable dans le catalogue actuel"
            });
            catalogTotal += artPrix * artQte;
          } else {
            const catPrix = Number(catalog.prix) || 0;
            catalogTotal += catPrix * artQte;
            if (Math.round(catPrix) !== Math.round(artPrix)) {
              anomalies.push({
                type: "price_mismatch",
                titre: art.titre || "Article",
                cmdPrix: artPrix,
                catPrix: catPrix,
                message: `Prix commande ${fmt(artPrix)} ≠ catalogue ${fmt(catPrix)}`
              });
            }
          }
        }
      }

      const totalCmd = Number(o.total) || 0;
      // Anomalie (c) : le total de la commande ≠ somme des prix × quantités des articles
      if (Math.abs(articleTotal - totalCmd) > 1) {
        anomalies.push({
          type: "total_mismatch",
          titre: "TOTAL",
          cmdPrix: totalCmd,
          catPrix: articleTotal,
          message: `Total commande ${fmt(totalCmd)} ≠ somme des articles ${fmt(articleTotal)}`
        });
      }

      return {
        suspicious: anomalies.length > 0,
        anomalies,
        expectedTotal: catalogTotal,
        commandTotal: totalCmd
      };
    }

    // ============================================================
    // AUTH + CHARGEMENT CATALOGUE + ÉCOUTE COMMANDES
    // ============================================================
    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "authentification.html"; return; }

      if (!ADMIN_UIDS.includes(user.uid)) {
        $("mainContent").style.display = "none";
        $("accessDenied").style.display = "block";
        return;
      }

      $("mainContent").style.display = "block";

      // Charge le catalogue produits une seule fois
      try {
        const catalogSnap = await getDocs(collection(db, "produits"));
        catalogSnap.forEach(d => { productCatalog[d.id] = d.data(); });
      } catch (err) {
        console.error("Erreur catalogue:", err);
        toast("Impossible de charger le catalogue — vérifiez les règles Firestore", "bad");
        // On continue quand même : les commandes s'afficheront mais toutes les anomalies "produit introuvable" apparaîtront.
      }

      // Écoute en temps réel des commandes
      onSnapshot(collection(db, "commandes"), (snap) => {
        const newOrders = [];
        snap.forEach(d => newOrders.push({ id: d.id, ...d.data() }));
        newOrders.sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));

        if (!isFirstLoad) {
          const prevIds = new Set(allOrders.map(o => o.id));
          const added = newOrders.filter(o => !prevIds.has(o.id));
          if (added.length > 0) showNewOrderNotification(added.length);
        }

        allOrders = newOrders;
        isFirstLoad = false;
        render();
      }, (err) => {
        console.error("Erreur onSnapshot:", err);
        $("ordersList").innerHTML = `<div class="state">Erreur de chargement. Vérifiez les règles Firestore.</div>`;
      });
    });

    function showNewOrderNotification(count) {
      const banner = $("newOrderBanner");
      banner.textContent = `🔔 ${count} nouvelle${count > 1 ? "s" : ""} commande${count > 1 ? "s" : ""} !`;
      banner.classList.add("show");
      setTimeout(() => banner.classList.remove("show"), 4000);

      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.frequency.value = 880;
          gain.gain.setValueAtTime(0.1, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.3);
        }
      } catch (e) {}
    }

    // ============================================================
    // FILTRAGE ET RENDU
    // ============================================================
    function getFilteredOrders() {
      return allOrders.filter(o => {
        const analysis = analyzeOrder(o);

        // Filtre "suspicious" : uniquement les commandes suspectes
        if (currentStatus === "suspicious") {
          if (!analysis.suspicious) return false;
        } else if (currentStatus !== "all") {
          if (o.statut !== currentStatus) return false;
        }

        if (currentPay === "paye" && o.paiement !== "paye") return false;
        if (currentPay === "non_paye" && o.paiement === "paye") return false;

        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const num = (o.numero || "").toLowerCase();
          const nom = (o.clientNom || "").toLowerCase();
          const tel = String(o.telephone || "").replace(/\D/g, "");
          if (!num.includes(q) && !nom.includes(q) && !tel.includes(q.replace(/\D/g, ""))) return false;
        }
        return true;
      });
    }

    function render() {
      let suspiciousCount = 0;
      allOrders.forEach(o => { if (analyzeOrder(o).suspicious) suspiciousCount++; });

      $("totalCount").textContent = allOrders.length;
      $("countPending").textContent = allOrders.filter(o => o.statut === "en_attente").length;
      $("countToConfirm").textContent = allOrders.filter(o => o.statut === "confirmee").length;
      $("countUnpaid").textContent = allOrders.filter(o => o.paiement === "non_paye" && o.statut !== "annulee").length;
      $("countPaid").textContent = allOrders.filter(o => o.paiement === "paye").length;
      $("countSuspicious").textContent = suspiciousCount;

      const list = getFilteredOrders();

      if (list.length === 0) {
        $("ordersList").innerHTML = `<div class="state">Aucune commande ne correspond aux filtres.</div>`;
        return;
      }

      $("ordersList").innerHTML = list.map(o => renderOrderCard(o)).join("");
    }

    function renderOrderCard(o) {
      const analysis = analyzeOrder(o);
      const date = o.createdAt?.toDate
        ? o.createdAt.toDate().toLocaleString("fr-FR", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" })
        : "—";

      const phone = cleanPhone(o.telephone);
      const phoneDisplay = esc(o.telephone);
      const waMsg = encodeURIComponent(`Bonjour ${o.clientNom}, c'est NUMA concernant votre commande ${o.numero}.`);
      const waLink = `https://wa.me/${phone}?text=${waMsg}`;

      let locationHtml = "";
      if (o.position?.mapsUrl && /^https:\/\/www\.google\.com\/maps/.test(o.position.mapsUrl)) {
        locationHtml = `<a href="${esc(o.position.mapsUrl)}" target="_blank" rel="noopener" class="action-btn maps">
          <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          Google Maps
        </a>`;
      }
      const addressText = o.adresseTexte
        ? `<div style="font-size:12px;color:#666;margin-top:6px;">📍 ${esc(o.adresseTexte)}</div>`
        : "";

      let payBadge = "";
      if (o.modePaiement === "livraison") {
        payBadge = `<span class="pay-badge livraison">Paiement à la livraison</span>`;
      } else if (o.paiement === "paye") {
        payBadge = `<span class="pay-badge paye">Payé</span>`;
      } else {
        payBadge = `<span class="pay-badge non_paye">Non payé</span>`;
      }

      const payBtn = o.paiement === "paye"
        ? `<button class="btn-unpaid" data-action="unpay" data-id="${esc(o.id)}">Marquer non payé</button>`
        : `<button class="btn-paid" data-action="pay" data-id="${esc(o.id)}">Marquer payé</button>`;

      const statusSelect = `
        <select class="select-status" data-action="status" data-id="${esc(o.id)}">
          ${Object.entries(STATUS_LABELS).map(([val, label]) => 
            `<option value="${val}" ${o.statut === val ? "selected" : ""}>${label}</option>`
          ).join("")}
        </select>
      `;

      const itemsHtml = (o.articles || []).map(a => {
        const artPrix = Number(a.prix) || 0;
        const catPrix = productCatalog[a.produitId] ? Number(productCatalog[a.produitId].prix) || 0 : null;
        const isSuspect = catPrix !== null && Math.round(catPrix) !== Math.round(artPrix);
        return `
          <div class="item">
            <img src="${esc(a.imageUrl || "")}" alt="">
            <div class="item-info">
              <div class="item-title">${esc(a.titre)}</div>
              <div class="item-meta">Taille ${esc(a.taille)} • Qté ${a.quantite}${isSuspect ? ` • <span style="color:var(--red);">catalogue : ${fmt(catPrix)}</span>` : ""}</div>
            </div>
            <div class="item-price ${isSuspect ? "suspect" : ""}">${fmt(artPrix)}</div>
          </div>
        `;
      }).join("");

      // Bandeau d'anomalie
      const suspiciousBanner = analysis.suspicious
        ? `<div class="suspicious-banner">
            <strong>⚠ PRIX SUSPECT</strong>
            Total commande : ${fmt(analysis.commandTotal)} — Total attendu (prix catalogue actuels) : ${fmt(analysis.expectedTotal)}
            ${analysis.anomalies.map(an => `<div class="anomaly-line">${esc(an.titre)} : <b>${esc(an.message)}</b></div>`).join("")}
            <div style="margin-top:6px;font-size:11px;opacity:.8;font-style:italic;">ℹ️ Peut aussi venir d'un changement de prix fait après la commande. À vérifier avant de confirmer.</div>
          </div>`
        : "";

      return `
        <div class="order-card ${analysis.suspicious ? "suspicious-card" : ""}">
          ${suspiciousBanner}
          <div class="order-head">
            <div>
              <div class="order-id">${esc(o.numero)}</div>
              <div class="order-date">${date}</div>
            </div>
            <div class="badges">
              <span class="status ${esc(o.statut)}">${STATUS_LABELS[o.statut] || o.statut}</span>
              ${payBadge}
            </div>
          </div>

          <div class="client-block">
            <div class="client-name">${esc(o.clientNom)}</div>
            <div class="client-info">📞 ${phoneDisplay}${o.clientEmail ? " • " + esc(o.clientEmail) : ""}</div>
            <div class="client-actions">
              <a href="tel:${esc(o.telephone)}" class="action-btn call">
                <svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
                Appeler
              </a>
              <a href="${waLink}" target="_blank" rel="noopener" class="action-btn wa">
                <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2z"/></svg>
                WhatsApp
              </a>
              ${locationHtml}
            </div>
            ${addressText}
          </div>

          <div class="items">${itemsHtml}</div>

          <div class="card-footer">
            <div class="total-box">
              <span>TOTAL</span>
              ${fmt(o.total)}
            </div>
            <div class="order-controls">
              ${statusSelect}
              ${payBtn}
            </div>
          </div>
        </div>
      `;
    }

    // ============================================================
    // FILTRES
    // ============================================================
    $("statusFilters").addEventListener("click", (e) => {
      const btn = e.target.closest(".filter-btn");
      if (!btn) return;
      $("statusFilters").querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentStatus = btn.dataset.status;
      render();
    });

    $("payFilters").addEventListener("click", (e) => {
      const btn = e.target.closest(".filter-btn");
      if (!btn) return;
      $("payFilters").querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentPay = btn.dataset.pay;
      render();
    });

    let searchTimer;
    $("searchInput").addEventListener("input", (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        searchQuery = e.target.value.trim();
        render();
      }, 200);
    });

    // ============================================================
    // ACTIONS (pay/unpay + statut avec confirmation renforcée)
    // ============================================================
    $("ordersList").addEventListener("click", async (e) => {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;

      const action = btn.dataset.action;
      const id = btn.dataset.id;
      if (!id) return;

      if (action === "pay" || action === "unpay") {
        const isPay = action === "pay";
        const order = allOrders.find(o => o.id === id);
        if (!order) return;

        const analysis = analyzeOrder(order);

        // Confirmation renforcée si la commande est suspecte et qu'on va la marquer payée
        if (isPay && analysis.suspicious) {
          let msg = `⚠ ATTENTION : cette commande présente des anomalies de prix.\n\n`;
          msg += `Numéro : ${order.numero}\n`;
          msg += `Total commande : ${fmt(analysis.commandTotal)}\n`;
          msg += `Total attendu (catalogue actuel) : ${fmt(analysis.expectedTotal)}\n\n`;
          msg += `Détail :\n`;
          analysis.anomalies.forEach(a => msg += `• ${a.titre} : ${a.message}\n`);
          msg += `\nConfirmer le paiement MALGRÉ TOUT ?`;
          if (!confirm(msg)) return;
        } else if (isPay) {
          if (!confirm(`Marquer la commande ${order.numero} comme PAYÉE ?`)) return;
        } else {
          if (!confirm(`Marquer la commande ${order.numero} comme NON PAYÉE ?`)) return;
        }

        btn.disabled = true;
        try {
          await updateDoc(doc(db, "commandes", id), {
            paiement: isPay ? "paye" : "non_paye"
          });
          toast(isPay ? "Commande marquée payée ✓" : "Commande marquée non payée", "ok");
        } catch (err) {
          console.error(err);
          toast("Erreur : " + err.message, "bad");
          btn.disabled = false;
        }
      }
    });

    $("ordersList").addEventListener("change", async (e) => {
      const sel = e.target.closest("[data-action='status']");
      if (!sel) return;

      const id = sel.dataset.id;
      const newStatus = sel.value;
      const order = allOrders.find(o => o.id === id);
      if (!order) return;

      const analysis = analyzeOrder(order);
      const criticalStatuses = ["confirmee", "en_preparation", "expediee", "livree"];

      // Confirmation renforcée pour les statuts critiques sur une commande suspecte
      if (analysis.suspicious && criticalStatuses.includes(newStatus)) {
        let msg = `⚠ ATTENTION : cette commande présente des anomalies de prix.\n\n`;
        msg += `Numéro : ${order.numero}\n`;
        msg += `Total commande : ${fmt(analysis.commandTotal)}\n`;
        msg += `Total attendu (catalogue actuel) : ${fmt(analysis.expectedTotal)}\n\n`;
        msg += `Détail :\n`;
        analysis.anomalies.forEach(a => msg += `• ${a.titre} : ${a.message}\n`);
        msg += `\nPasser au statut "${STATUS_LABELS[newStatus]}" MALGRÉ TOUT ?`;
        if (!confirm(msg)) {
          sel.value = order.statut;
          return;
        }
      }

      sel.disabled = true;
      try {
        await updateDoc(doc(db, "commandes", id), { statut: newStatus });
        toast(`Statut mis à jour : ${STATUS_LABELS[newStatus]}`, "ok");
      } catch (err) {
        console.error(err);
        toast("Erreur : " + err.message, "bad");
        sel.value = order.statut;
      } finally {
        sel.disabled = false;
      }
    });
  </script>
</body>
</html>
